
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="css/index.css">
  <title>Vote</title>
</head>
<body>
   <main class="container">
        <div class="icon-check">✓</div>

        <h1>Merci pour votre contribution !</h1>

        <p>
            Votre réponse (<strong id="message"></strong>) a bien été prise en compte !
            <br>
            Si vous souhaitez laisser un avis avec un
            questionnaire plus détaillé, suivez ce lien :
        </p>

        <a href="https://votre-lien-questionnaire.fr"
           class="btn-questionnaire"
           target="_blank"
           rel="noopener noreferrer">
            Accéder au questionnaire →
        </a>

        <div class="separator">
            <span>★</span>
        </div>
    </main>


  <script type="module">
    import { createClient } from
      'https://esm.sh/@supabase/supabase-js@2';

    const SUPABASE_URL = 'https://ulqhxjgkakfthyginxur.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_33FJZTYqCySn4tYt6zFLMQ_NnUBRLhz';

    const supabase = createClient(
      SUPABASE_URL,
      SUPABASE_ANON_KEY
    );

    const params = new URLSearchParams(
      window.location.search
    );

    const answer = params.get('answer');
    const message = document.getElementById('message');

    async function vote() {
      if (!['yes', 'no'].includes(answer)) {
        message.textContent = 'Réponse invalide.';
        return;
      }

      const { error } = await supabase
        .from('votes')
        .insert({ answer });

      message.textContent = error
        ? 'ERREUR'
        : answer;
    }

    vote();
  </script>
</body>
</html>
